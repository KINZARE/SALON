name: bootstrap-existing-salon-source

on:
  push:
    branches: [main]
    paths:
      - "salon-saas-preview-ready.zip"

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Expand existing SALON codebase
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .bootstrap
          mkdir .bootstrap
          unzip -q salon-saas-preview-ready.zip -d .bootstrap
          shopt -s dotglob
          cp -a .bootstrap/salon-saas/. .
          rm -rf .bootstrap salon-saas-preview-ready.zip
          rm -f .github/workflows/bootstrap-source.yml
      - name: Commit imported source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "chore: import existing SALON codebase"
          git push origin HEAD:main
