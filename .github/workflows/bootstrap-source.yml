name: bootstrap-existing-salon-source

on:
  push:
    branches: [main]
    paths:
      - "salon-saas-preview-ready*.zip"
      - ".github/workflows/bootstrap-source.yml"

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Expand existing SALON codebase
        shell: bash
        run: |
          set -euo pipefail
          ZIP_PATH="$(find . -maxdepth 1 -type f -name 'salon-saas-preview-ready*.zip' -print -quit)"
          test -n "$ZIP_PATH"
          rm -rf .bootstrap
          mkdir .bootstrap
          unzip -q "$ZIP_PATH" -d .bootstrap
          shopt -s dotglob
          cp -a .bootstrap/salon-saas/. .
          rm -rf .bootstrap
          rm -f salon-saas-preview-ready*.zip
          rm -f .github/workflows/bootstrap-source.yml
      - name: Commit imported source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: import existing SALON codebase"
          git push origin HEAD:main
