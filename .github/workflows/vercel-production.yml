name: orsira-guarded-production
on:
  push:
    branches: [main]
permissions:
  contents: read
  checks: read
  pull-requests: read
jobs:
  authorize-production:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require merged exact candidate and all reviewed quality gates
        uses: actions/github-script@v7
        with:
          script: |
            const {owner,repo}=context.repo;
            const prs=await github.rest.repos.listPullRequestsAssociatedWithCommit({owner,repo,commit_sha:context.sha});
            const pr=prs.data.find(p=>p.merged_at&&p.base.ref==='main');
            if(!pr)throw new Error('Production requires a merged reviewed PR');
            const candidate=pr.head.sha;
            const mainCommit=await github.rest.git.getCommit({owner,repo,commit_sha:context.sha});
            const testedCommit=await github.rest.git.getCommit({owner,repo,commit_sha:candidate});
            if(mainCommit.data.tree.sha!==testedCommit.data.tree.sha)throw new Error('Main tree differs from tested candidate');
            const checks=await github.rest.checks.listForRef({owner,repo,ref:candidate,per_page:100});
            for(const name of ['verify','browser-qa','live-preview-verification']){
              const gate=checks.data.check_runs.find(c=>c.name===name);
              if(gate?.conclusion!=='success')throw new Error(`Candidate gate ${name} has not passed`);
            }
            await core.summary.addHeading('Production source authorized').addTable([['Candidate SHA','Main SHA'],[candidate,context.sha]]).write();
  production-smoke:
    needs: authorize-production
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      NEXT_PUBLIC_SUPABASE_URL: https://pqozwzakdqtueunictid.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_v7adLt1okM7r8JudNT-xXQ_MVGEYFvD
      SALON_QA_SHA: ${{ github.sha }}
      QA_BASE_URL: https://orsira-salon-preview.onrender.com
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Require authorized main SHA live after manual guarded Render deployment
        run: node scripts/verify-hosted-sha.mjs --wait
      - name: Synthetic production workday, responsive and public-booking smoke
        run: npx playwright test --project=one-screen --project=responsive --project=migration-390 --project=migration-1440
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-smoke-${{ github.sha }}
          path: qa-artifacts
          retention-days: 30
