name: orsira-render-live-verification
on:
  push:
    branches: [ops/orsira-vercel-recovery]
    paths: [.github/workflows/vercel-recovery.yml]
permissions:
  contents: read
env:
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
  NEXT_PUBLIC_SUPABASE_URL: https://pqozwzakdqtueunictid.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_v7adLt1okM7r8JudNT-xXQ_MVGEYFvD
  SALON_QA_SHA: ee5dcd25850a160432ba04736312590b78063321
  QA_BASE_URL: https://orsira-salon-preview.onrender.com
  QA_BASELINE_URL: https://orsira-salon-baseline.onrender.com
jobs:
  live-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ee5dcd25850a160432ba04736312590b78063321
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Wait for healthy Render services
        run: |
          node --input-type=module <<'NODE'
          for(const base of [process.env.QA_BASELINE_URL,process.env.QA_BASE_URL]){
            let ready=false;
            for(let i=0;i<40;i++){
              try {const r=await fetch(base+'/app/today',{signal:AbortSignal.timeout(30000)}); const body=await r.text();if(r.ok&&body.includes('Vandaag')){ready=true;console.log('HEALTHY',base,r.status);break;}}catch{}
              await new Promise(r=>setTimeout(r,15000));
            }
            if(!ready)throw new Error('Render service unavailable: '+base);
          }
          NODE
      - name: Full browser QA on exact Render candidate
        run: npm run test:e2e
      - name: Daily core candidate performance
        env:
          QA_PROFILE_LABEL: render-after
        run: node scripts/simplicity-performance.mjs
      - name: Equivalent Render baseline performance
        env:
          QA_BASE_URL: https://orsira-salon-baseline.onrender.com
          QA_PROFILE_LABEL: before
        run: node scripts/performance-measure.mjs
      - name: Equivalent Render candidate performance
        env:
          QA_PROFILE_LABEL: after
        run: node scripts/performance-measure.mjs
      - name: Compare actual hosted performance
        run: node scripts/performance-compare.mjs
      - name: Compare Today to Calendar navigation
        run: node scripts/performance-navigation.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: render-live-qa-ee5dcd25850a160432ba04736312590b78063321
          path: qa-artifacts
          retention-days: 30
