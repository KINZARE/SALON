name: orsira-render-targeted-performance
on:
  push:
    branches: [ops/orsira-vercel-recovery]
    paths: [.github/workflows/vercel-recovery.yml]
permissions:
  contents: read
jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ee5dcd25850a160432ba04736312590b78063321
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Alternate matched hosts to investigate LCP variance
        run: |
          node --input-type=module <<'NODE'
          import {chromium} from 'playwright';
          import {mkdir,writeFile} from 'node:fs/promises';
          const browser=await chromium.launch(),rows=[];
          const hosts={before:'https://orsira-salon-baseline.onrender.com',after:'https://orsira-salon-preview.onrender.com'};
          try{
            for(const [route,width] of [['/app/reports',1440],['/app/staff',390]]){
              for(let run=0;run<7;run++)for(const label of run%2?['after','before']:['before','after']){
                const context=await browser.newContext({viewport:{width,height:900}}),page=await context.newPage();
                await page.addInitScript(()=>{window.__p={lcp:null,cls:0};new PerformanceObserver(l=>{for(const e of l.getEntries())window.__p.lcp=e.startTime}).observe({type:'largest-contentful-paint',buffered:true});new PerformanceObserver(l=>{for(const e of l.getEntries())if(!e.hadRecentInput)window.__p.cls+=e.value}).observe({type:'layout-shift',buffered:true})});
                for(const cache of ['cold','warm']){
                  const response=await page.goto(hosts[label]+route,{waitUntil:'networkidle',timeout:45000});if(!response.ok())throw Error('Unavailable');
                  await page.locator('h1').first().waitFor();
                  const metrics=await page.evaluate(()=>{const n=performance.getEntriesByType('navigation')[0];return{ttfbMs:n.responseStart,lcpMs:window.__p.lcp,cls:window.__p.cls}});
                  rows.push({route,width,run,label,cache,...metrics});
                }
                await context.close();
              }
            }
          }finally{await browser.close()}
          const median=a=>a.sort((x,y)=>x-y)[Math.floor(a.length/2)],summary=[];
          for(const [route,width] of [['/app/reports',1440],['/app/staff',390]])for(const cache of ['cold','warm'])for(const label of ['before','after']){
            const subset=rows.filter(r=>r.route===route&&r.cache===cache&&r.label===label);
            summary.push({route,width,cache,label,ttfbMs:median(subset.map(r=>r.ttfbMs)),lcpMs:median(subset.map(r=>r.lcpMs)),cls:Math.max(...subset.map(r=>r.cls)),lcpSamples:subset.map(r=>r.lcpMs)});
          }
          await mkdir('qa-artifacts',{recursive:true});await writeFile('qa-artifacts/targeted-performance.json',JSON.stringify({sha:'ee5dcd25850a160432ba04736312590b78063321',conditions:'Seven alternating paired fresh contexts per case, same runner and Chromium, unthrottled lab',rows,summary},null,2));
          console.log('TARGETED_PERFORMANCE '+JSON.stringify(summary));
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: render-targeted-performance
          path: qa-artifacts
          retention-days: 30
