name: orsira-render-production-smoke
on:
  push:
    branches: [ops/orsira-vercel-recovery]
    paths: [.github/workflows/vercel-recovery.yml]
permissions:
  contents: read
env:
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
  NEXT_PUBLIC_SUPABASE_URL: https://pqozwzakdqtueunictid.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_v7adLt1okM7r8JudNT-xXQ_MVGEYFvD
  SALON_QA_SHA: c9b39429c52bc734930b9c3dedc1064c5029bcc6
  QA_BASE_URL: https://orsira-salon-preview.onrender.com
jobs:
  production-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c9b39429c52bc734930b9c3dedc1064c5029bcc6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Final HTTP and retired baseline checks
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {mkdir,writeFile} from 'node:fs/promises';
          const results=[];
          for(const path of ['/','/pricing','/app/today','/app/calendar','/app/customers','/app/reports','/app/more','/book/salon']){
            const r=await fetch(process.env.QA_BASE_URL+path,{signal:AbortSignal.timeout(45000)}),body=await r.text();
            assert.equal(r.status,200,path);assert.equal(new URL(r.url).pathname,path);assert.ok(body.includes('ORSIRA'),path);
            assert.ok(!/Preview mode|Baan Thai Wellness|Welkom terug/.test(body),path);
            results.push({path,status:r.status,url:r.url});
          }
          for(const path of ['/book-link/invalid','/manage/invalid','/intake/invalid']){
            const r=await fetch(process.env.QA_BASE_URL+path,{signal:AbortSignal.timeout(30000)});assert.equal(r.status,404,path);results.push({path,status:r.status});
          }
          const retired=await fetch('https://orsira-salon-baseline.onrender.com/app/today',{signal:AbortSignal.timeout(30000)});
          assert.equal(retired.status,500,'Baseline DB access must be retired after removing credentials');
          await mkdir('qa-artifacts',{recursive:true});
          const evidence={sha:process.env.SALON_QA_SHA,results,baselineRetiredHttpStatus:retired.status};
          await writeFile('qa-artifacts/production-http.json',JSON.stringify(evidence,null,2));console.log('PRODUCTION_HTTP_PASS '+JSON.stringify(evidence));
          NODE
      - name: Production daily flows including real temporary booking cancellation cleanup
        run: npm run test:e2e -- --project=simplicity
      - name: Production responsive navigation brand and focus
        run: npm run test:e2e -- --project=responsive
      - name: Malformed API bodies remain rejected before mutation
        run: npm run test:e2e -- --project=migration-390 --grep "malformed API bodies"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orsira-render-production-c9b39429c52bc734930b9c3dedc1064c5029bcc6
          path: qa-artifacts
          retention-days: 30
