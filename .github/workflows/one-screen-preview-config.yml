name: orsira-preview-configuration
on:
  push:
    branches: [ops/orsira-one-screen-preview]
    paths: [.github/workflows/one-screen-preview-config.yml]
permissions:
  contents: read
jobs:
  configure:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Encrypt credential for authorized ORSIRA preview
        env:
          DATABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
