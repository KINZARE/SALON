name: vercel-preview

on:
  push:
    branches: [preview]

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_TOKEN: "${{ secrets.VERCEL_TOKEN }}"
      SALON_PREVIEW_DEMO_MODE: "1"
      NEXT_PUBLIC_SUPABASE_URL: "https://pqozwzakdqtueunictid.supabase.co"
      NEXT_PUBLIC_SUPABASE_ANON_KEY: "sb_publishable_v7adLt1okM7r8JudNT-xXQ_MVGEYFvD"
      SUPABASE_SERVICE_ROLE_KEY: "preview-placeholder"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Require Vercel token
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN" || {
            echo "Missing repository secret VERCEL_TOKEN"
            exit 1
          }

      - name: Ensure Vercel project exists
        shell: bash
        run: |
          set -euo pipefail
          if ! npx --yes vercel@latest project inspect salon --token="$VERCEL_TOKEN" >/dev/null 2>&1; then
            npx --yes vercel@latest project add salon --token="$VERCEL_TOKEN" --non-interactive
          fi

      - name: Temporarily disable Vercel Authentication
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --request PATCH \
            --url "https://api.vercel.com/v9/projects/salon" \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            --header "Content-Type: application/json" \
            --data '{"ssoProtection":null}' > /tmp/vercel-project.json

      - name: Configure Vercel as Next.js
        shell: bash
        run: |
          set -euo pipefail
          npx --yes vercel@latest project update salon \
            --framework nextjs \
            --auto-detect output-directory \
            --token="$VERCEL_TOKEN" \
            --non-interactive \
            --yes

      - name: Deploy public no-login preview
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          URL="$(npx --yes vercel@latest deploy \
            --yes \
            --project salon \
            --token="$VERCEL_TOKEN" \
            --build-env SALON_PREVIEW_DEMO_MODE=1 \
            --build-env NEXT_PUBLIC_SUPABASE_URL="$NEXT_PUBLIC_SUPABASE_URL" \
            --build-env NEXT_PUBLIC_SUPABASE_ANON_KEY="$NEXT_PUBLIC_SUPABASE_ANON_KEY" \
            --build-env SUPABASE_SERVICE_ROLE_KEY="$SUPABASE_SERVICE_ROLE_KEY" \
            --env SALON_PREVIEW_DEMO_MODE=1 \
            --env NEXT_PUBLIC_SUPABASE_URL="$NEXT_PUBLIC_SUPABASE_URL" \
            --env NEXT_PUBLIC_SUPABASE_ANON_KEY="$NEXT_PUBLIC_SUPABASE_ANON_KEY" \
            --env SUPABASE_SERVICE_ROLE_KEY="$SUPABASE_SERVICE_ROLE_KEY")"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "### SALON public no-login preview" >> "$GITHUB_STEP_SUMMARY"
          echo "$URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke test public no-login preview
        shell: bash
        env:
          PREVIEW_URL: "${{ steps.deploy.outputs.url }}"
        run: |
          set -euo pipefail

          HOME_CODE="$(curl --silent --show-error --location --output /tmp/home.html --write-out '%{http_code}' "$PREVIEW_URL/")"
          TODAY_RESULT="$(curl --silent --show-error --location --output /tmp/today.html --write-out '%{http_code}|%{url_effective}' "$PREVIEW_URL/app/today")"
          BOOK_CODE="$(curl --silent --show-error --location --output /tmp/book.html --write-out '%{http_code}' "$PREVIEW_URL/book/baan-thai-demo")"

          TODAY_CODE="${TODAY_RESULT%%|*}"
          TODAY_URL="${TODAY_RESULT#*|}"

          echo "home=$HOME_CODE today=$TODAY_RESULT booking=$BOOK_CODE"

          test "$HOME_CODE" = "200"
          test "$TODAY_CODE" = "200"
          test "$BOOK_CODE" = "200"

          if echo "$TODAY_URL" | grep -Eqi '/login([?#].*)?$'; then
            echo "Preview still redirects to login."
            exit 1
          fi

          grep -qi "Preview mode" /tmp/today.html

          if grep -qi "Application error" /tmp/home.html /tmp/today.html /tmp/book.html; then
            echo "Application error detected."
            exit 1
          fi

          echo "Public no-login preview checks passed for $PREVIEW_URL"
