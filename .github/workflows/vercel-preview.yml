name: vercel-real

on:
  push:
    branches: [workspace/operational-core]
  pull_request:
    branches: [main]

env:
  SUPABASE_SERVICE_ROLE_KEY: "${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}"
  NEXT_PUBLIC_SUPABASE_URL: "https://pqozwzakdqtueunictid.supabase.co"
  NEXT_PUBLIC_SUPABASE_ANON_KEY: "sb_publishable_v7adLt1okM7r8JudNT-xXQ_MVGEYFvD"
  SALON_QA_SHA: "${{ github.event.pull_request.head.sha || github.sha }}"

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "${{ env.SALON_QA_SHA }}"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Require real Supabase configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$NEXT_PUBLIC_SUPABASE_URL"
          test -n "$NEXT_PUBLIC_SUPABASE_ANON_KEY"
          test -n "$SUPABASE_SERVICE_ROLE_KEY"
      - name: Install application dependencies
        run: npm install
      - name: Build production app
        run: npm run build
      - name: Install Chromium QA runtime
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Start production server
        shell: bash
        run: |
          set -euo pipefail
          nohup npm run start -- -H 127.0.0.1 > /tmp/salon-server.log 2>&1 &
          echo $! > /tmp/salon-server.pid
          for i in {1..40}; do
            if curl --silent --fail http://127.0.0.1:3000/login >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/salon-server.log
          exit 1
      - name: Browser QA for real authenticated mode
        env:
          QA_BASE_URL: "http://127.0.0.1:3000"
        run: node scripts/workspace-browser-qa.mjs
      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-auth-browser-qa-${{ env.SALON_QA_SHA }}
          path: qa-artifacts
          if-no-files-found: ignore
          retention-days: 14

  deploy-preview:
    needs: browser-qa
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_TOKEN: "${{ secrets.VERCEL_TOKEN }}"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "${{ env.SALON_QA_SHA }}"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Require deployment secrets and exact SHA
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN"
          test -n "$SUPABASE_SERVICE_ROLE_KEY"
          test "$(git rev-parse HEAD)" = "$SALON_QA_SHA"
          echo "Exact deployment SHA verified: $SALON_QA_SHA"
      - name: Ensure Vercel project exists
        shell: bash
        run: |
          set -euo pipefail
          if ! npx --yes vercel@latest project inspect salon --token="$VERCEL_TOKEN" >/dev/null 2>&1; then
            npx --yes vercel@latest project add salon --token="$VERCEL_TOKEN" --non-interactive
          fi
      - name: Link Vercel project
        run: npx --yes vercel@latest link --yes --project salon --token="$VERCEL_TOKEN"
      - name: Configure Vercel as Next.js
        run: npx --yes vercel@latest project update salon --framework nextjs --auto-detect output-directory --token="$VERCEL_TOKEN" --non-interactive --yes
      - name: Deploy authenticated real-data preview
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          URL="$(npx --yes vercel@latest deploy \
            --yes \
            --project salon \
            --token="$VERCEL_TOKEN" \
            --meta salonQaSha="$SALON_QA_SHA" \
            --build-env NEXT_PUBLIC_SUPABASE_URL="$NEXT_PUBLIC_SUPABASE_URL" \
            --build-env NEXT_PUBLIC_SUPABASE_ANON_KEY="$NEXT_PUBLIC_SUPABASE_ANON_KEY" \
            --build-env SUPABASE_SERVICE_ROLE_KEY="$SUPABASE_SERVICE_ROLE_KEY" \
            --env NEXT_PUBLIC_SUPABASE_URL="$NEXT_PUBLIC_SUPABASE_URL" \
            --env NEXT_PUBLIC_SUPABASE_ANON_KEY="$NEXT_PUBLIC_SUPABASE_ANON_KEY" \
            --env SUPABASE_SERVICE_ROLE_KEY="$SUPABASE_SERVICE_ROLE_KEY")"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "### SALON real authenticated app" >> "$GITHUB_STEP_SUMMARY"
          echo "SHA: $SALON_QA_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "URL: $URL" >> "$GITHUB_STEP_SUMMARY"
      - name: Verify Vercel deployment is READY
        shell: bash
        env:
          PREVIEW_URL: "${{ steps.deploy.outputs.url }}"
        run: |
          set -euo pipefail
          npx --yes vercel@latest inspect "$PREVIEW_URL" --token="$VERCEL_TOKEN" 2>&1 | tee /tmp/vercel-inspect.txt
          grep -Eqi 'Ready' /tmp/vercel-inspect.txt
      - name: Smoke test real authenticated app
        shell: bash
        env:
          PREVIEW_URL: "${{ steps.deploy.outputs.url }}"
        run: |
          set -euo pipefail
          ROOT_RESULT="$(npx --yes vercel@latest curl / --deployment "$PREVIEW_URL" -- --silent --show-error --location --output /tmp/root.html --write-out '%{http_code}|%{url_effective}')"
          APP_RESULT="$(npx --yes vercel@latest curl /app/today --deployment "$PREVIEW_URL" -- --silent --show-error --location --output /tmp/app.html --write-out '%{http_code}|%{url_effective}')"
          LOGIN_RESULT="$(npx --yes vercel@latest curl /login --deployment "$PREVIEW_URL" -- --silent --show-error --location --output /tmp/login.html --write-out '%{http_code}|%{url_effective}')"
          SIGNUP_RESULT="$(npx --yes vercel@latest curl /signup --deployment "$PREVIEW_URL" -- --silent --show-error --location --output /tmp/signup.html --write-out '%{http_code}|%{url_effective}')"

          ROOT_CODE="${ROOT_RESULT%%|*}"
          APP_CODE="${APP_RESULT%%|*}"
          LOGIN_CODE="${LOGIN_RESULT%%|*}"
          SIGNUP_CODE="${SIGNUP_RESULT%%|*}"
          ROOT_URL="${ROOT_RESULT#*|}"
          APP_URL="${APP_RESULT#*|}"

          echo "root=$ROOT_RESULT app=$APP_RESULT login=$LOGIN_RESULT signup=$SIGNUP_RESULT"
          test "$ROOT_CODE" = "200"
          test "$APP_CODE" = "200"
          test "$LOGIN_CODE" = "200"
          test "$SIGNUP_CODE" = "200"
          echo "$ROOT_URL" | grep -Eqi '/login([?#].*)?$'
          echo "$APP_URL" | grep -Eqi '/login([?#].*)?$'
          grep -qi "Welkom terug" /tmp/login.html
          grep -qi "Maak je salon boekbaar" /tmp/signup.html

          if grep -Eqi "Preview mode|Baan Thai Wellness|Sophie de Vries|preview@salon-demo.nl" /tmp/root.html /tmp/app.html /tmp/login.html /tmp/signup.html; then
            echo "Demo content detected in real-mode deployment"
            exit 1
          fi

          echo "Real authenticated SALON smoke checks passed for $PREVIEW_URL"
