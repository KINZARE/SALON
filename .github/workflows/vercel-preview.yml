name: vercel-preview

on:
  push:
    branches: [preview]

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_TOKEN: "${{ secrets.VERCEL_TOKEN }}"
      SALON_PREVIEW_DEMO_MODE: "1"
      NEXT_PUBLIC_SUPABASE_URL: "https://example.supabase.co"
      NEXT_PUBLIC_SUPABASE_ANON_KEY: "preview-placeholder"
      SUPABASE_SERVICE_ROLE_KEY: "preview-placeholder"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Require Vercel token
        shell: bash
        run: |
          test -n "$VERCEL_TOKEN" || {
            echo "Missing repository secret VERCEL_TOKEN"
            exit 1
          }

      - name: Ensure Vercel project exists
        shell: bash
        run: |
          set -euo pipefail
          if ! npx --yes vercel@latest project inspect salon --token="$VERCEL_TOKEN" >/dev/null 2>&1; then
            npx --yes vercel@latest project add salon --token="$VERCEL_TOKEN" --non-interactive
          fi

      - name: Configure Vercel as Next.js
        shell: bash
        run: |
          set -euo pipefail
          npx --yes vercel@latest project update salon \
            --framework nextjs \
            --auto-detect output-directory \
            --token="$VERCEL_TOKEN" \
            --non-interactive \
            --yes

      - name: Deploy preview
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          URL="$(npx --yes vercel@latest deploy             --yes             --project salon             --token="$VERCEL_TOKEN"             --build-env SALON_PREVIEW_DEMO_MODE=1             --build-env NEXT_PUBLIC_SUPABASE_URL=https://example.supabase.co             --build-env NEXT_PUBLIC_SUPABASE_ANON_KEY=preview-placeholder             --build-env SUPABASE_SERVICE_ROLE_KEY=preview-placeholder             --env SALON_PREVIEW_DEMO_MODE=1             --env NEXT_PUBLIC_SUPABASE_URL=https://example.supabase.co             --env NEXT_PUBLIC_SUPABASE_ANON_KEY=preview-placeholder             --env SUPABASE_SERVICE_ROLE_KEY=preview-placeholder)"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "### SALON Vercel Preview" >> "$GITHUB_STEP_SUMMARY"
          echo "$URL" >> "$GITHUB_STEP_SUMMARY"
