name: vercel-preview

on:
  push:
    branches: [workspace/operational-core]

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_TOKEN: "${{ secrets.VERCEL_TOKEN }}"
      SUPABASE_SERVICE_ROLE_KEY: "${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}"
      SALON_PREVIEW_DEMO_MODE: "1"
      NEXT_PUBLIC_SUPABASE_URL: "https://pqozwzakdqtueunictid.supabase.co"
      NEXT_PUBLIC_SUPABASE_ANON_KEY: "sb_publishable_v7adLt1okM7r8JudNT-xXQ_MVGEYFvD"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Require deployment secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN" || {
            echo "Missing repository secret VERCEL_TOKEN"
            exit 1
          }
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || {
            echo "Missing repository secret SUPABASE_SERVICE_ROLE_KEY"
            exit 1
          }

      - name: Ensure Vercel project exists
        shell: bash
        run: |
          set -euo pipefail
          if ! npx --yes vercel@latest project inspect salon --token="$VERCEL_TOKEN" >/dev/null 2>&1; then
            npx --yes vercel@latest project add salon --token="$VERCEL_TOKEN" --non-interactive
          fi

      - name: Link Vercel project
        shell: bash
        run: |
          set -euo pipefail
          npx --yes vercel@latest link --yes --project salon --token="$VERCEL_TOKEN"

      - name: Configure Vercel as Next.js
        shell: bash
        run: |
          set -euo pipefail
          npx --yes vercel@latest project update salon \
            --framework nextjs \
            --auto-detect output-directory \
            --token="$VERCEL_TOKEN" \
            --non-interactive \
            --yes

      - name: Deploy synthetic no-login preview
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          URL="$(npx --yes vercel@latest deploy \
            --yes \
            --project salon \
            --token="$VERCEL_TOKEN" \
            --meta salonQaSha="$GITHUB_SHA" \
            --build-env SALON_PREVIEW_DEMO_MODE=1 \
            --build-env NEXT_PUBLIC_SUPABASE_URL="$NEXT_PUBLIC_SUPABASE_URL" \
            --build-env NEXT_PUBLIC_SUPABASE_ANON_KEY="$NEXT_PUBLIC_SUPABASE_ANON_KEY" \
            --build-env SUPABASE_SERVICE_ROLE_KEY="$SUPABASE_SERVICE_ROLE_KEY" \
            --env SALON_PREVIEW_DEMO_MODE=1 \
            --env NEXT_PUBLIC_SUPABASE_URL="$NEXT_PUBLIC_SUPABASE_URL" \
            --env NEXT_PUBLIC_SUPABASE_ANON_KEY="$NEXT_PUBLIC_SUPABASE_ANON_KEY" \
            --env SUPABASE_SERVICE_ROLE_KEY="$SUPABASE_SERVICE_ROLE_KEY")"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "### SALON operational preview" >> "$GITHUB_STEP_SUMMARY"
          echo "SHA: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "URL: $URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke test no-login synthetic preview
        shell: bash
        env:
          PREVIEW_URL: "${{ steps.deploy.outputs.url }}"
        run: |
          set -euo pipefail

          TODAY_RESULT="$(npx --yes vercel@latest curl /app/today \
            --deployment "$PREVIEW_URL" \
            -- --silent --show-error --location --output /tmp/today.html --write-out '%{http_code}|%{url_effective}')"
          CALENDAR_RESULT="$(npx --yes vercel@latest curl /app/calendar \
            --deployment "$PREVIEW_URL" \
            -- --silent --show-error --location --output /tmp/calendar.html --write-out '%{http_code}|%{url_effective}')"
          CUSTOMERS_RESULT="$(npx --yes vercel@latest curl /app/customers \
            --deployment "$PREVIEW_URL" \
            -- --silent --show-error --location --output /tmp/customers.html --write-out '%{http_code}|%{url_effective}')"

          TODAY_CODE="${TODAY_RESULT%%|*}"
          CALENDAR_CODE="${CALENDAR_RESULT%%|*}"
          CUSTOMERS_CODE="${CUSTOMERS_RESULT%%|*}"
          TODAY_URL="${TODAY_RESULT#*|}"

          echo "today=$TODAY_RESULT calendar=$CALENDAR_RESULT customers=$CUSTOMERS_RESULT"

          test "$TODAY_CODE" = "200"
          test "$CALENDAR_CODE" = "200"
          test "$CUSTOMERS_CODE" = "200"
          echo "$TODAY_URL" | grep -Eqi '/app/today([?#].*)?$'

          grep -qi "Preview mode" /tmp/today.html
          grep -qi "Today" /tmp/today.html
          grep -qi "Calendar" /tmp/calendar.html
          grep -qi "Sophie de Vries" /tmp/customers.html

          if grep -qi "Application error" /tmp/today.html /tmp/calendar.html /tmp/customers.html; then
            echo "Application error detected in preview smoke test."
            exit 1
          fi

          echo "No-login synthetic preview smoke checks passed for $PREVIEW_URL"
