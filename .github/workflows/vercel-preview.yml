name: orsira-one-screen-verification

on:
  push:
    branches: [workspace/operational-core]
  pull_request:
    branches: [main]

env:
  SUPABASE_SERVICE_ROLE_KEY: "${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}"
  NEXT_PUBLIC_SUPABASE_URL: "https://pqozwzakdqtueunictid.supabase.co"
  NEXT_PUBLIC_SUPABASE_ANON_KEY: "sb_publishable_v7adLt1okM7r8JudNT-xXQ_MVGEYFvD"
  SALON_QA_SHA: "${{ github.event.pull_request.head.sha || github.sha }}"

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "${{ env.SALON_QA_SHA }}"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Require real Supabase configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$NEXT_PUBLIC_SUPABASE_URL"
          test -n "$NEXT_PUBLIC_SUPABASE_ANON_KEY"
          test -n "$SUPABASE_SERVICE_ROLE_KEY"
      - name: Install application dependencies
        run: npm ci --no-audit --no-fund
      - name: Build production app
        run: npm run build
      - name: Install Chromium QA runtime
        run: |
          npx playwright install --with-deps chromium
      - name: Start production server
        shell: bash
        run: |
          set -euo pipefail
          nohup npm run start -- -H 127.0.0.1 > /tmp/salon-server.log 2>&1 &
          echo $! > /tmp/salon-server.pid
          for i in {1..40}; do
            if curl --silent --fail http://127.0.0.1:3000/app/today >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/salon-server.log
          exit 1
      - name: Browser QA for real no-login mode
        env:
          QA_BASE_URL: "http://127.0.0.1:3000"
        run: npm run test:e2e
      - name: Measure exact candidate performance
        env:
          QA_BASE_URL: "http://127.0.0.1:3000"
          QA_PROFILE_LABEL: "local-after"
        run: node scripts/simplicity-performance.mjs
      - name: Compare real database reads against unchanged baseline
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin c9b39429c52bc734930b9c3dedc1064c5029bcc6 --depth=1
          git worktree add --detach /tmp/salon-performance-before c9b39429c52bc734930b9c3dedc1064c5029bcc6
          cp -a "$PWD/node_modules" /tmp/salon-performance-before/node_modules
          SALON_SOURCE_ROOT=/tmp/salon-performance-before QA_PROFILE_LABEL=before node --experimental-strip-types scripts/performance-queries.mjs
          QA_PROFILE_LABEL=after node --experimental-strip-types scripts/performance-queries.mjs
      - name: Compare route bundles with pre-migration production build
        shell: bash
        run: |
          set -euo pipefail
          QA_PROFILE_LABEL=after node scripts/bundle-metrics.mjs
          (cd /tmp/salon-performance-before && npm run build)
          SALON_SOURCE_ROOT=/tmp/salon-performance-before QA_PROFILE_LABEL=before node scripts/bundle-metrics.mjs
      - name: Real database concurrency regression in isolated fixture
        run: node scripts/performance-concurrency.mjs
      - name: Measure current production simplicity baseline
        env:
          QA_BASE_URL: "https://orsira-salon-preview.onrender.com"
          QA_PROFILE_LABEL: "before"
        run: node scripts/simplicity-performance.mjs
      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-no-login-browser-qa-${{ env.SALON_QA_SHA }}
          path: qa-artifacts
          if-no-files-found: ignore
          retention-days: 14

  live-preview-verification:
    needs: browser-qa
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SALON_QA_SHA }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Require exact candidate on existing Render preview flow
        env:
          QA_BASE_URL: https://orsira-one-screen-day.onrender.com
        run: node scripts/verify-hosted-sha.mjs --wait
      - name: Full browser QA on exact hosted candidate
        env:
          QA_BASE_URL: https://orsira-one-screen-day.onrender.com
        run: npm run test:e2e
      - name: Exact preview performance
        env:
          QA_BASE_URL: https://orsira-one-screen-day.onrender.com
          QA_PROFILE_LABEL: preview-after
        run: node scripts/simplicity-performance.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-preview-qa-${{ env.SALON_QA_SHA }}
          path: qa-artifacts
          retention-days: 30
