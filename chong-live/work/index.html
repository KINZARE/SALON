<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#090909">
  <meta name="description" content="Selected and experimental 3D work by Tjong Tjong.">
  <title>Work — Tjong Tjong</title>

<body class="work-page">
  <header class="site-header">
    <a class="brand" href="../"><span>TJONG</span><span>TJONG</span></a>
    <p class="header-role">PORTFOLIO / ALL WORK</p>
    <a class="menu-toggle work-home-link" href="../">HOME ↗</a>

      <p class="eyebrow">PORTFOLIO / 2026</p>

      <button data-filter="all" class="is-active">All</button>

      <button data-filter="motion">Motion</button>
      <button data-filter="character">Character</button>
      <button data-filter="product">Product</button>
    </nav>
    <section class="work-grid" data-work-grid aria-live="polite"></section>

  <script type="module" src="../js/work.js"></script>
